# One-click setup on Render: New > Blueprint > pick this repo. Add SECRET_KEY when asked.
services:
  - type: web
    name: kyto
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi -c gunicorn.conf.py
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false            # paste your own 64+ character key (see README)
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: kyto-db
          property: connectionString
databases:
  - name: kyto-db
    plan: free
