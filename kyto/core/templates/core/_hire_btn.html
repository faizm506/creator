{% if user.is_authenticated %}{% if p.is_creator and user.profile.role == "brand" %}<a class="btn btn-primary" href="{% url 'offer_new' p.handle %}">Hire {{ p.display_name|truncatechars:16 }}</a>{% elif not p.is_creator and user.profile.role == "creator" %}<a class="btn btn-primary" href="{% url 'offer_new' p.handle %}">Pitch this brand</a>{% endif %}{% else %}<a class="btn btn-primary" href="{% url 'login' %}?next={% url 'offer_new' p.handle %}">{% if p.is_creator %}Hire{% else %}Pitch this brand{% endif %}</a>{% endif %}
